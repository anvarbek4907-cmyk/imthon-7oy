<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Yangi maqola</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, sans-serif;
            background: #f1f5f9;
            color: #1e293b;
        }

        header {
            background: #1e3a5f;
            padding: 25px 20px;
        }

        .header {
            max-width: 900px;
            margin: auto;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .logo {
            color: white;
            font-size: 28px;
            font-weight: bold;
        }

        .search {
            display: flex;
            gap: 8px;
        }

        .search input {
            width: 250px;
            padding: 11px 14px;
            border: none;
            border-radius: 6px;
            outline: none;
        }

        .search button {
            padding: 11px 18px;
            border: none;
            border-radius: 6px;
            background: #3498db;
            color: white;
            cursor: pointer;
        }

        .container {
            max-width: 900px;
            margin: 40px auto;
            padding: 0 20px;
        }

        .back {
            color: #3498db;
            text-decoration: none;
            display: inline-block;
            margin-bottom: 15px;
        }

        h1 {
            font-size: 38px;
            margin-bottom: 30px;
        }

        .card {
            background: white;
            padding: 35px;
            border-radius: 12px;
            box-shadow: 0 5px 20px rgba(0, 0, 0, 0.08);
        }

        .form-group {
            margin-bottom: 25px;
        }

        label {
            display: block;
            font-weight: bold;
            margin-bottom: 8px;
        }

        input[type="text"],
        input[type="file"],
        select,
        textarea {
            width: 100%;
            padding: 13px;
            border: 1px solid #cbd5e1;
            border-radius: 7px;
            font-size: 16px;
            background: white;
            outline: none;
        }

        textarea {
            min-height: 180px;
            resize: vertical;
        }

        input:focus,
        select:focus,
        textarea:focus {
            border-color: #3498db;
        }

        .buttons {
            display: flex;
            gap: 12px;
            margin-top: 30px;
        }

        .btn {
            padding: 13px 25px;
            border: none;
            border-radius: 7px;
            font-size: 16px;
            cursor: pointer;
            text-decoration: none;
        }

        .save {
            background: #3498db;
            color: white;
        }

        .cancel {
            background: #e2e8f0;
            color: #334155;
        }

        .errorlist {
            color: #dc2626;
            margin: 5px 0;
            list-style: none;
        }

        @media (max-width: 700px) {
            .header {
                flex-direction: column;
                gap: 20px;
            }

            .search {
                width: 100%;
            }

            .search input {
                width: 100%;
            }

            h1 {
                font-size: 30px;
            }

            .card {
                padding: 22px;
            }
        }
    </style>
</head>
<body>

<header>
    <div class="header">
        <div class="logo">Blog</div>

        <form class="search" method="get" action="{% url 'home' %}">
            <input type="text" name="q" placeholder="Qidirish...">
            <button type="submit">Qidirish</button>
        </form>
    </div>
</header>

<div class="container">

    <a href="{% url 'home' %}" class="back">← Bosh sahifa</a>

    <h1>Yangi maqola yozish</h1>

    <div class="card">
        <form method="post" enctype="multipart/form-data">
            {% csrf_token %}

            {{ form.non_field_errors }}

            <div class="form-group">
                <label for="{{ form.title.id_for_label }}">Sarlavha</label>
                {{ form.title }}
                {{ form.title.errors }}
            </div>

            <div class="form-group">
                <label for="{{ form.category.id_for_label }}">Kategoriya</label>
                {{ form.category }}
                {{ form.category.errors }}
            </div>

            <div class="form-group">
                <label for="{{ form.image.id_for_label }}">Rasm</label>
                {{ form.image }}
                {{ form.image.errors }}
            </div>

            <div class="form-group">
                <label for="{{ form.desc.id_for_label }}">Maqola matni</label>
                {{ form.desc }}
                {{ form.desc.errors }}
            </div>

            <div class="buttons">
                <button type="submit" class="btn save">Maqolani saqlash</button>
                <a href="{% url 'home' %}" class="btn cancel">Bekor qilish</a>
            </div>
        </form>
    </div>

</div>

</body>
</html>
