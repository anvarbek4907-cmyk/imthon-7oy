<!DOCTYPE html>
<html lang="uz">

<head>
    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Postni o‘chirish</title>

    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background: #f4f7fb;
            color: #1f2937;
        }

        .container {
            width: 90%;
            max-width: 600px;
            margin: 100px auto;
        }

        .box {
            background: white;
            padding: 40px;
            border-radius: 18px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.10);
            text-align: center;
        }

        .icon {
            font-size: 60px;
            margin-bottom: 20px;
        }

        h1 {
            margin-bottom: 15px;
            color: #111827;
        }

        .text {
            color: #6b7280;
            margin-bottom: 30px;
            line-height: 1.6;
        }

        .post-title {
            color: #111827;
            font-weight: bold;
        }

        .buttons {
            display: flex;
            justify-content: center;
            gap: 12px;
        }

        .btn {
            border: none;
            padding: 12px 22px;
            border-radius: 8px;
            text-decoration: none;
            font-size: 15px;
            cursor: pointer;
            display: inline-block;
        }

        .cancel {
            background: #e5e7eb;
            color: #374151;
        }

        .cancel:hover {
            background: #d1d5db;
        }

        .delete {
            background: #dc2626;
            color: white;
        }

        .delete:hover {
            background: #b91c1c;
        }

    </style>
</head>

<body>

<div class="container">

    <div class="box">

        <div class="icon">
            🗑️
        </div>

        <h1>
            Postni o‘chirish
        </h1>

        <p class="text">

            Siz rostdan ham

            <span class="post-title">
                "{{ object.title }}"
            </span>

            postini o‘chirmoqchimisiz?

            <br><br>

            Bu amalni qaytarib bo‘lmaydi.

        </p>

        <div class="buttons">

            <a href="{% url 'post-detail' object.slug %}"
               class="btn cancel">

                Bekor qilish

            </a>

            <form method="post">

                {% csrf_token %}

                <button type="submit"
                        class="btn delete">

                    🗑️ Ha, o‘chirish

                </button>

            </form>

        </div>

    </div>

</div>

</body>

</html>
