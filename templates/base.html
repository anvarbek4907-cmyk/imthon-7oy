<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Blog Platforma{% endblock %}</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background: #f4f7fb;
            color: #1f2937;
        }

        .navbar {
            background: #111827;
            padding: 18px 0;
            box-shadow: 0 3px 10px rgba(0,0,0,0.15);
        }

        .nav-content {
            width: 90%;
            max-width: 1200px;
            margin: auto;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .logo {
            color: white;
            font-size: 26px;
            font-weight: bold;
            text-decoration: none;
        }

        .nav-links {
            display: flex;
            gap: 10px;
            align-items: center;
        }

        .nav-links a {
            color: white;
            text-decoration: none;
            padding: 9px 15px;
            border-radius: 8px;
        }

        .nav-links a:hover {
            background: #374151;
        }

        .logout-btn {
            background: #e74c3c;
            color: white;
            border: none;
            padding: 9px 15px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 14px;
            font-family: Arial, sans-serif;
        }

        .logout-btn:hover {
            background: #c0392b;
        }

        .container {
            width: 90%;
            max-width: 1200px;
            margin: 40px auto;
        }

        footer {
            margin-top: 60px;
            background: #111827;
            color: #9ca3af;
            text-align: center;
            padding: 30px;
        }

        @media (max-width: 600px) {
            .nav-content {
                flex-direction: column;
                gap: 15px;
            }
        }
    </style>
</head>

<body>

<nav class="navbar">
    <div class="nav-content">
        <a href="{% url 'home' %}" class="logo">📝 Blog Platforma</a>

        <div class="nav-links">
            {% if user.is_authenticated %}
                <a href="{% url 'post-create' %}">+ Post yozish</a>

                <form method="post" action="{% url 'logout' %}" style="display:inline; margin:0;">
                    {% csrf_token %}
                    <button type="submit" class="logout-btn">Chiqish</button>
                </form>
            {% else %}
                <a href="/users/login/">Kirish</a>
                <a href="/users/register/">Ro‘yxatdan o‘tish</a>
            {% endif %}
        </div>
    </div>
</nav>

<div class="container">
    {% block content %}
    {% endblock %}
</div>

<footer>
    <p>© 2026 Blog Platforma. Barcha huquqlar himoyalangan.</p>
</footer>

</body>
