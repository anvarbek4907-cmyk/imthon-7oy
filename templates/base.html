<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}Blog{% endblock %}</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: Arial, sans-serif; background: #f5f5f5; color: #222; line-height: 1.6; }
        .container { max-width: 800px; margin: 0 auto; padding: 0 20px; }
        header { background: #2c3e50; padding: 20px 0; }
        header .container { display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 10px; }
        header a { color: #fff; text-decoration: none; }
        .logo { font-size: 22px; font-weight: bold; }
        nav a { margin-left: 15px; font-size: 14px; }
        nav a:hover { text-decoration: underline; }
        .search-form { margin-top: 12px; display: flex; }
        .search-form input { padding: 8px; border: none; width: 200px; }
        .search-form button { padding: 8px 14px; border: none; background: #3498db; color: #fff; cursor: pointer; }
        main { padding: 30px 0; }
        footer { text-align: center; padding: 20px 0; color: #888; font-size: 13px; }
        .btn { display: inline-block; padding: 8px 16px; background: #3498db; color: #fff; text-decoration: none; border: none; border-radius: 4px; cursor: pointer; font-size: 14px; }
        .btn:hover { background: #2980b9; }
        .btn-danger { background: #e74c3c; }
        .btn-danger:hover { background: #c0392b; }
        .btn-outline { background: #fff; color: #333; border: 1px solid #ccc; }
        .btn-outline:hover { background: #eee; }
    </style>
    {% block extra_head %}{% endblock %}
</head>
<body>

<header>
    <div class="container">
        <a href="{% url 'home' %}" class="logo">Blog</a>
        <nav>
            <a href="{% url 'home' %}">Bosh sahifa</a>
            {% if user.is_authenticated %}
                <a href="{% url 'post-create' %}">Yozish</a>
            {% endif %}
        </nav>
    </div>
    <div class="container">
        <form method="get" action="{% url 'home' %}" class="search-form">
            <input type="text" name="q" placeholder="Qidirish..." value="{{ request.GET.q }}">
            <button type="submit">Qidirish</button>
        </form>
    </div>
</header>

<main class="container">
    {% block content %}{% endblock %}
</main>

<footer>
    &copy; {% now "Y" %} Blog
</footer>

</body>
</html>
